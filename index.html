    <noscript>
      <h1>Cibarius, scadenze e magazzino in un'unica app</h1>
      <p>
        Cibarius tiene sotto controllo le scadenze alimentari e il magazzino. A casa
        gestisce dispensa, frigorifero e congelatore. Al ristorante copre i controlli
        HACCP, il registro delle temperature, le etichette di preparazione con QR di
        tracciabilità e il carico della merce dalla bolla. Ai nutrizionisti serve per
        i piani alimentari e il diario dei propri assistiti.
      </p>
      <p>
        Uso domestico gratuito. Piano ristorante 19,90 euro al mese oppure 199 euro
        all'anno, con trenta giorni di prova senza carta di credito.
      </p>
