<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Plate -->
  <ellipse cx="100" cy="115" rx="55" ry="45" fill="#E8F6FE" stroke="#22B6F2" stroke-width="2"/>
  <ellipse cx="100" cy="115" rx="40" ry="32" fill="white" stroke="#22B6F2" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
  <!-- Food items on plate -->
  <!-- Protein (chicken leg shape) -->
  <ellipse cx="85" cy="108" rx="14" ry="9" fill="#22B6F2" opacity="0.35" transform="rotate(-15 85 108)"/>
  <rect x="79" y="100" width="5" height="12" rx="2.5" fill="#0B7DBE" opacity="0.3" transform="rotate(-15 81 106)"/>
  <!-- Carbs (rice/grain) -->
  <ellipse cx="115" cy="106" rx="12" ry="8" fill="#22B6F2" opacity="0.2"/>
  <circle cx="110" cy="104" r="2.5" fill="#22B6F2" opacity="0.3"/>
  <circle cx="116" cy="102" r="2" fill="#22B6F2" opacity="0.25"/>
  <circle cx="120" cy="106" r="2.5" fill="#22B6F2" opacity="0.3"/>
  <!-- Veggies -->
  <circle cx="95" cy="120" r="4" fill="#22B6F2" opacity="0.4"/>
  <circle cx="105" cy="122" r="3" fill="#0B7DBE" opacity="0.3"/>
  <circle cx="88" cy="124" r="3.5" fill="#22B6F2" opacity="0.25"/>
  <!-- Macro chart (donut) -->
  <circle cx="185" cy="55" r="28" fill="white" stroke="#E8F6FE" stroke-width="3"/>
  <!-- Protein arc -->
  <circle cx="185" cy="55" r="22" fill="none" stroke="#22B6F2" stroke-width="7" stroke-dasharray="46 92" stroke-dashoffset="0" stroke-linecap="round"/>
  <!-- Carbs arc -->
  <circle cx="185" cy="55" r="22" fill="none" stroke="#0B7DBE" stroke-width="7" stroke-dasharray="32 106" stroke-dashoffset="-46" stroke-linecap="round" opacity="0.7"/>
  <!-- Fats arc -->
  <circle cx="185" cy="55" r="22" fill="none" stroke="#22B6F2" stroke-width="7" stroke-dasharray="20 118" stroke-dashoffset="-78" stroke-linecap="round" opacity="0.35"/>
  <!-- Center label -->
  <text x="185" y="52" text-anchor="middle" fill="#0B7DBE" font-size="7" font-weight="600" font-family="Inter, sans-serif">MACRO</text>
  <text x="185" y="62" text-anchor="middle" fill="#22B6F2" font-size="9" font-weight="700" font-family="Inter, sans-serif">P C F</text>
  <!-- Legend dots -->
  <circle cx="165" cy="92" r="3" fill="#22B6F2"/>
  <text x="172" y="95" fill="#0B7DBE" font-size="7" font-family="Inter, sans-serif">Proteine</text>
  <circle cx="165" cy="103" r="3" fill="#0B7DBE" opacity="0.7"/>
  <text x="172" y="106" fill="#0B7DBE" font-size="7" font-family="Inter, sans-serif">Carboidrati</text>
  <circle cx="165" cy="114" r="3" fill="#22B6F2" opacity="0.35"/>
  <text x="172" y="117" fill="#0B7DBE" font-size="7" font-family="Inter, sans-serif">Grassi</text>
  <!-- Recipe card floating left -->
  <rect x="18" y="40" width="48" height="60" rx="8" fill="white" stroke="#22B6F2" stroke-width="1.5"/>
  <!-- Recipe lines -->
  <rect x="24" y="48" width="36" height="4" rx="2" fill="#22B6F2" opacity="0.3"/>
  <rect x="24" y="56" width="28" height="3" rx="1.5" fill="#22B6F2" opacity="0.2"/>
  <rect x="24" y="62" width="32" height="3" rx="1.5" fill="#22B6F2" opacity="0.15"/>
  <rect x="24" y="68" width="24" height="3" rx="1.5" fill="#22B6F2" opacity="0.15"/>
  <!-- Recipe check -->
  <circle cx="42" cy="86" r="7" fill="#22B6F2" opacity="0.15"/>
  <path d="M38 86 L41 89 L47 83" stroke="#22B6F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Decorative -->
  <circle cx="30" cy="145" r="4" fill="#22B6F2" opacity="0.08"/>
  <circle cx="220" cy="140" r="5" fill="#0B7DBE" opacity="0.07"/>
  <circle cx="55" cy="25" r="3" fill="#22B6F2" opacity="0.1"/>
</svg>