<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Phone body -->
  <rect x="75" y="18" width="72" height="134" rx="13" fill="white" stroke="#22B6F2" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="82" y="33" width="58" height="100" rx="5" fill="#E8F6FE"/>
  <!-- Notch -->
  <rect x="98" y="23" width="26" height="4" rx="2" fill="#22B6F2" opacity="0.25"/>
  <!-- Home -->
  <circle cx="111" cy="145" r="4.5" stroke="#22B6F2" stroke-width="1.5" fill="none"/>
  <!-- Barcode lines -->
  <rect x="92" y="48" width="3.5" height="40" rx="1" fill="#0B7DBE" opacity="0.8"/>
  <rect x="98" y="48" width="5.5" height="40" rx="1" fill="#22B6F2" opacity="0.6"/>
  <rect x="107" y="48" width="2.5" height="40" rx="1" fill="#0B7DBE" opacity="0.7"/>
  <rect x="112" y="48" width="4.5" height="40" rx="1" fill="#7C3AED" opacity="0.5"/>
  <rect x="119" y="48" width="3.5" height="40" rx="1" fill="#0B7DBE" opacity="0.8"/>
  <rect x="125" y="48" width="2.5" height="40" rx="1" fill="#22B6F2" opacity="0.55"/>
  <rect x="130" y="48" width="4" height="40" rx="1" fill="#7C3AED" opacity="0.4"/>
  <!-- Scan line -->
  <rect x="88" y="66" width="46" height="3" rx="1.5" fill="#22C55E" opacity="0.9"/>
  <!-- Corner brackets -->
  <path d="M82 42 L82 35 L91 35" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M133 35 L140 35 L140 42" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M82 86 L82 93 L91 93" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M133 93 L140 93 L140 86" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text lines on screen -->
  <rect x="88" y="100" width="32" height="3.5" rx="1.75" fill="#22B6F2" opacity="0.35"/>
  <rect x="88" y="107" width="42" height="3.5" rx="1.75" fill="#22B6F2" opacity="0.25"/>
  <rect x="88" y="114" width="26" height="3.5" rx="1.75" fill="#22B6F2" opacity="0.18"/>
  <!-- Label tag -->
  <rect x="156" y="38" width="58" height="72" rx="9" fill="white" stroke="#FFB020" stroke-width="2"/>
  <!-- Label header -->
  <rect x="162" y="45" width="46" height="10" rx="3" fill="#FFB020" opacity="0.25"/>
  <text x="185" y="53" text-anchor="middle" fill="#E09800" font-size="7" font-weight="600" font-family="Inter, sans-serif">NUTRITION</text>
  <!-- Label lines -->
  <rect x="162" y="62" width="40" height="3" rx="1.5" fill="#0B7DBE" opacity="0.3"/>
  <rect x="162" y="69" width="30" height="3" rx="1.5" fill="#0B7DBE" opacity="0.22"/>
  <rect x="162" y="76" width="36" height="3" rx="1.5" fill="#0B7DBE" opacity="0.25"/>
  <!-- Date badge -->
  <rect x="162" y="86" width="34" height="16" rx="5" fill="#FF5A5F" opacity="0.15"/>
  <text x="179" y="97" text-anchor="middle" fill="#FF5A5F" font-size="9" font-weight="700" font-family="Inter, sans-serif">12/25</text>
  <!-- AI sparkle -->
  <circle cx="210" cy="34" r="10" fill="#FFB020" opacity="0.2"/>
  <text x="210" y="38.5" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="700">✦</text>
  <!-- Check badge -->
  <circle cx="156" cy="120" r="12" fill="#22C55E" opacity="0.15"/>
  <circle cx="156" cy="120" r="8" fill="#22C55E"/>
  <path d="M152 120 L155 123 L161 117" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Decorative -->
  <circle cx="40" cy="45" r="6" fill="#7C3AED" opacity="0.12"/>
  <circle cx="34" cy="135" r="4" fill="#22C55E" opacity="0.1"/>
  <circle cx="225" cy="145" r="7" fill="#FFB020" opacity="0.1"/>
  <circle cx="50" cy="90" r="3" fill="#FF5A5F" opacity="0.08"/>
</svg>