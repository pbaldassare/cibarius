<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Phone body -->
  <rect x="75" y="20" width="70" height="130" rx="12" fill="white" stroke="#22B6F2" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="82" y="34" width="56" height="96" rx="4" fill="#E8F6FE"/>
  <!-- Notch -->
  <rect x="98" y="24" width="24" height="4" rx="2" fill="#22B6F2" opacity="0.3"/>
  <!-- Home button -->
  <circle cx="110" cy="143" r="4" stroke="#22B6F2" stroke-width="1.5" fill="none"/>
  <!-- Barcode lines on screen -->
  <rect x="92" y="50" width="3" height="36" rx="1" fill="#0B7DBE" opacity="0.7"/>
  <rect x="98" y="50" width="5" height="36" rx="1" fill="#22B6F2" opacity="0.5"/>
  <rect x="106" y="50" width="2" height="36" rx="1" fill="#0B7DBE" opacity="0.6"/>
  <rect x="111" y="50" width="4" height="36" rx="1" fill="#22B6F2" opacity="0.4"/>
  <rect x="118" y="50" width="3" height="36" rx="1" fill="#0B7DBE" opacity="0.7"/>
  <rect x="124" y="50" width="2" height="36" rx="1" fill="#22B6F2" opacity="0.5"/>
  <rect x="129" y="50" width="4" height="36" rx="1" fill="#0B7DBE" opacity="0.4"/>
  <!-- Scan line (animated feel) -->
  <rect x="88" y="66" width="44" height="2.5" rx="1" fill="#22B6F2" opacity="0.8"/>
  <!-- Small text lines on screen bottom -->
  <rect x="88" y="95" width="30" height="3" rx="1.5" fill="#22B6F2" opacity="0.3"/>
  <rect x="88" y="102" width="40" height="3" rx="1.5" fill="#22B6F2" opacity="0.2"/>
  <rect x="88" y="109" width="24" height="3" rx="1.5" fill="#22B6F2" opacity="0.15"/>
  <!-- Label / tag floating right -->
  <rect x="158" y="42" width="54" height="68" rx="8" fill="white" stroke="#22B6F2" stroke-width="2"/>
  <!-- Label header -->
  <rect x="163" y="48" width="44" height="8" rx="2" fill="#22B6F2" opacity="0.2"/>
  <!-- Label lines -->
  <rect x="163" y="62" width="38" height="3" rx="1.5" fill="#0B7DBE" opacity="0.3"/>
  <rect x="163" y="69" width="28" height="3" rx="1.5" fill="#0B7DBE" opacity="0.2"/>
  <rect x="163" y="76" width="34" height="3" rx="1.5" fill="#0B7DBE" opacity="0.25"/>
  <!-- Date badge on label -->
  <rect x="163" y="86" width="30" height="14" rx="4" fill="#22B6F2" opacity="0.15"/>
  <text x="178" y="96" text-anchor="middle" fill="#0B7DBE" font-size="8" font-weight="600" font-family="Inter, sans-serif">12/25</text>
  <!-- Corner brackets (scan frame) -->
  <path d="M82 44 L82 38 L90 38" stroke="#22B6F2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M132 38 L138 38 L138 44" stroke="#22B6F2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M82 82 L82 88 L90 88" stroke="#22B6F2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M132 88 L138 88 L138 82" stroke="#22B6F2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- AI sparkle -->
  <circle cx="168" cy="34" r="8" fill="#F39C12" opacity="0.15"/>
  <text x="168" y="38" text-anchor="middle" fill="#F39C12" font-size="11" font-weight="700">✦</text>
  <!-- Decorative -->
  <circle cx="42" cy="50" r="5" fill="#22B6F2" opacity="0.1"/>
  <circle cx="36" cy="130" r="4" fill="#0B7DBE" opacity="0.08"/>
  <circle cx="220" cy="140" r="6" fill="#22B6F2" opacity="0.08"/>
</svg>