<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Fridge body -->
  <rect x="70" y="30" width="80" height="120" rx="10" fill="#E8F6FE" stroke="#22B6F2" stroke-width="2.5"/>
  <!-- Fridge divider -->
  <line x1="70" y1="85" x2="150" y2="85" stroke="#22B6F2" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Handle top -->
  <rect x="140" y="50" width="4" height="18" rx="2" fill="#0B7DBE"/>
  <!-- Handle bottom -->
  <rect x="140" y="100" width="4" height="18" rx="2" fill="#0B7DBE"/>
  <!-- Items inside top -->
  <rect x="82" y="42" width="20" height="14" rx="3" fill="#22B6F2" opacity="0.35"/>
  <rect x="106" y="42" width="14" height="14" rx="3" fill="#0B7DBE" opacity="0.3"/>
  <circle cx="92" cy="68" r="6" fill="#22B6F2" opacity="0.25"/>
  <rect x="104" y="62" width="22" height="10" rx="3" fill="#22B6F2" opacity="0.2"/>
  <!-- Items inside bottom -->
  <rect x="82" y="95" width="18" height="12" rx="3" fill="#0B7DBE" opacity="0.25"/>
  <rect x="106" y="95" width="24" height="12" rx="3" fill="#22B6F2" opacity="0.2"/>
  <circle cx="92" cy="122" r="7" fill="#22B6F2" opacity="0.15"/>
  <!-- Calendar -->
  <rect x="158" y="34" width="46" height="42" rx="8" fill="white" stroke="#22B6F2" stroke-width="2"/>
  <rect x="158" y="34" width="46" height="14" rx="8" fill="#22B6F2"/>
  <rect x="158" y="44" width="46" height="4" fill="#22B6F2"/>
  <!-- Calendar hooks -->
  <rect x="168" y="30" width="3" height="10" rx="1.5" fill="#0B7DBE"/>
  <rect x="192" y="30" width="3" height="10" rx="1.5" fill="#0B7DBE"/>
  <!-- Calendar dots (days) -->
  <circle cx="168" cy="57" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <circle cx="177" cy="57" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <circle cx="186" cy="57" r="2.5" fill="#22B6F2"/>
  <circle cx="195" cy="57" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <circle cx="168" cy="66" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <circle cx="177" cy="66" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <circle cx="186" cy="66" r="2.5" fill="#22B6F2" opacity="0.5"/>
  <!-- Alert badge -->
  <circle cx="200" cy="38" r="10" fill="#F39C12"/>
  <text x="200" y="42" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter, sans-serif">!</text>
  <!-- Clock icon bottom-right -->
  <circle cx="172" cy="110" r="16" fill="white" stroke="#22B6F2" stroke-width="2"/>
  <line x1="172" y1="110" x2="172" y2="100" stroke="#0B7DBE" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="110" x2="180" y2="112" stroke="#0B7DBE" stroke-width="2" stroke-linecap="round"/>
  <!-- Small decorative dots -->
  <circle cx="40" cy="60" r="4" fill="#22B6F2" opacity="0.12"/>
  <circle cx="50" cy="140" r="6" fill="#22B6F2" opacity="0.08"/>
  <circle cx="210" cy="145" r="5" fill="#0B7DBE" opacity="0.1"/>
</svg>