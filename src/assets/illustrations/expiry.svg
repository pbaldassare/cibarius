<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Fridge body -->
  <rect x="70" y="30" width="80" height="120" rx="10" fill="white" stroke="#22B6F2" stroke-width="2.5"/>
  <!-- Fridge divider -->
  <line x1="70" y1="85" x2="150" y2="85" stroke="#22B6F2" stroke-width="1.5" opacity="0.4"/>
  <!-- Handle top -->
  <rect x="141" y="50" width="4" height="18" rx="2" fill="#0B7DBE"/>
  <!-- Handle bottom -->
  <rect x="141" y="100" width="4" height="18" rx="2" fill="#0B7DBE"/>
  <!-- Items top shelf -->
  <rect x="80" y="40" width="22" height="16" rx="4" fill="#22C55E" opacity="0.7"/>
  <rect x="80" y="40" width="22" height="6" rx="4" fill="#22C55E"/>
  <rect x="106" y="42" width="16" height="14" rx="4" fill="#FFB020" opacity="0.6"/>
  <circle cx="130" cy="50" r="7" fill="#FF5A5F" opacity="0.25"/>
  <circle cx="130" cy="50" r="4" fill="#FF5A5F" opacity="0.5"/>
  <rect x="80" y="62" width="28" height="12" rx="3" fill="#22B6F2" opacity="0.2"/>
  <circle cx="120" cy="68" r="6" fill="#FFB020" opacity="0.3"/>
  <!-- Items bottom shelf -->
  <rect x="80" y="94" width="20" height="14" rx="4" fill="#7C3AED" opacity="0.35"/>
  <rect x="104" y="94" width="26" height="14" rx="4" fill="#22B6F2" opacity="0.25"/>
  <circle cx="88" cy="122" r="7" fill="#22C55E" opacity="0.2"/>
  <circle cx="104" cy="124" r="5" fill="#FFB020" opacity="0.2"/>
  <rect x="116" y="116" width="18" height="10" rx="3" fill="#FF5A5F" opacity="0.15"/>
  <!-- Calendar -->
  <rect x="158" y="32" width="50" height="46" rx="9" fill="white" stroke="#FFB020" stroke-width="2"/>
  <rect x="158" y="32" width="50" height="16" rx="9" fill="#FFB020"/>
  <rect x="158" y="44" width="50" height="4" fill="#FFB020"/>
  <!-- Calendar hooks -->
  <rect x="170" y="28" width="3.5" height="11" rx="1.75" fill="#E09800"/>
  <rect x="193" y="28" width="3.5" height="11" rx="1.75" fill="#E09800"/>
  <!-- Calendar days -->
  <circle cx="170" cy="58" r="3" fill="#22B6F2" opacity="0.4"/>
  <circle cx="180" cy="58" r="3" fill="#22B6F2" opacity="0.4"/>
  <circle cx="190" cy="58" r="3" fill="#FF5A5F"/>
  <circle cx="200" cy="58" r="3" fill="#22B6F2" opacity="0.4"/>
  <circle cx="170" cy="68" r="3" fill="#22B6F2" opacity="0.4"/>
  <circle cx="180" cy="68" r="3" fill="#22C55E" opacity="0.6"/>
  <circle cx="190" cy="68" r="3" fill="#22B6F2" opacity="0.4"/>
  <!-- Alert badge -->
  <circle cx="204" cy="36" r="11" fill="#FF5A5F"/>
  <text x="204" y="40.5" text-anchor="middle" fill="white" font-size="13" font-weight="700" font-family="Inter, sans-serif">!</text>
  <!-- Clock icon -->
  <circle cx="175" cy="112" r="18" fill="white" stroke="#FF5A5F" stroke-width="2.5"/>
  <line x1="175" y1="112" x2="175" y2="100" stroke="#FF5A5F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="112" x2="184" y2="115" stroke="#FF5A5F" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="175" cy="112" r="2" fill="#FF5A5F"/>
  <!-- Decorative -->
  <circle cx="38" cy="55" r="5" fill="#FFB020" opacity="0.15"/>
  <circle cx="48" cy="142" r="7" fill="#22C55E" opacity="0.12"/>
  <circle cx="215" cy="148" r="5" fill="#FF5A5F" opacity="0.1"/>
  <circle cx="30" cy="100" r="3" fill="#7C3AED" opacity="0.1"/>
</svg>